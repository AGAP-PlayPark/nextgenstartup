<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Activity - Jan 07th</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      function sendHeight() {
        let message = { height: document.body.scrollHeight };

        window.top.postMessage(message, "*");
      }

      window.addEventListener("load", sendHeight);

      // PDF iframe이 로드되면 높이 재전송
      window.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("iframe.pdf-frame").forEach((f) => {
          f.addEventListener("load", sendHeight);
        });
      });
    </script>
  </head>
  <body>
    <div class="container">
      <div
        class="sub-item-media"
        style="padding: 0; grid-template-columns: repeat(1, 1fr) !important"
      >
        <div
          style="
            position: relative;
            width: 100%;
            margin: 0 auto 0;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
          "
        >
          <iframe
            style="
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              border: none;
            "
            src="https://www.youtube.com/embed/MGgrWgzNo9U"
            title="NextGen Startup Challenge"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
            "
            allowfullscreen
          ></iframe>
        </div>

        <img src="./images/img20-2-6.jpg" />
        <img src="./images/img15-1-1.jpg" />
        <img src="./images/img15-3-6.jpg" />
      </div>
    </div>
  </body>
</html>
